; ==================================================================
;  KONFIGURASI STRATEGY TESTER - XAUUSD_Scalper_M1_Pro
;  Broker 3 digit (Exness). Menjalankan backtest otomatis.
;
;  CARA MENJALANKAN (Windows, command prompt):
;    "C:\Program Files\MetaTrader 5\terminal64.exe" /config:"C:\path\backtest_XAUUSD_M1_Pro.ini"
;  (gunakan path LENGKAP ke file .ini ini)
;
;  PRASYARAT:
;   1) Compile XAUUSD_Scalper_M1_Pro.mq5 -> hasil .ex5 ada di
;      <Data Folder>\MQL5\Experts\  (buka via File > Open Data Folder).
;      Jika EA ditaruh dalam subfolder, sesuaikan "Expert=" di bawah,
;      mis. Expert=Scalper\XAUUSD_Scalper_M1_Pro.ex5
;   2) Untuk mode /config, file .set HARUS berada di
;      <Data Folder>\MQL5\Profiles\Tester\
;      (beda dgn load manual lewat tab Inputs yg pakai folder Presets).
;   3) Ganti "Symbol=" persis dgn nama simbol emas di broker Anda
;      (Exness bisa "XAUUSD", "XAUUSDm", dll). Salah nama = test gagal.
; ==================================================================

[Tester]
; --- EA & parameter ---
Expert=XAUUSD_Scalper_M1_Pro.ex5
ExpertParameters=XAUUSD_Scalper_M1_Pro_Exness_3digit.set

; --- Simbol & timeframe ---
Symbol=XAUUSD
Period=M1

; --- Akun (kosongkan = pakai akun aktif) ---
Login=

; --- Mode pemodelan ---
;  0=Every tick  1=1 minute OHLC  2=Open prices only
;  3=Math calc   4=Every tick based on real ticks  <-- paling akurat
;  Jika data real ticks tidak tersedia utk periode ini, ganti ke 0.
Model=4

; --- Emulasi delay eksekusi (ms). 0 = tanpa delay ---
ExecutionMode=0

; --- Rentang tanggal (YYYY.MM.DD). Sesuaikan dgn ketersediaan data ---
FromDate=2025.07.01
ToDate=2026.07.01

; --- Forward test: 0=off 1=1/2 2=1/3 3=1/4 4=custom(ForwardDate) ---
ForwardMode=0
ForwardDate=

; --- Modal & akun uji ---
Deposit=1000
Currency=USD
Leverage=500
ProfitInPips=0

; --- Optimasi: 0=off (single backtest) 1=slow 2=genetik 3=semua simbol ---
Optimization=0
;  Kriteria (dipakai saat Optimization>0):
;  0=Balance 1=Profit Factor 2=Expected Payoff 3=Drawdown
;  4=Recovery 5=Sharpe 6=Custom(OnTester) 7=Complex
OptimizationCriterion=0

; --- Laporan hasil ---
Report=Report_XAUUSD_M1_Pro
ReplaceReport=1

; --- 1=tutup terminal setelah selesai (untuk otomasi/CI), 0=biarkan ---
ShutdownTerminal=0

; --- 1=mode visual (lihat grafik jalan), 0=cepat tanpa visual ---
Visual=0

; ==================================================================
;  UNTUK OPTIMASI (bukan single backtest), ubah:
;    Optimization=2            ; algoritma genetik (cepat)
;    OptimizationCriterion=5   ; mis. Sharpe Ratio, atau 4=Recovery
;    Visual=0
;    ShutdownTerminal=1        ; opsional, agar auto-close saat batch
;  Lalu di file .set, ganti flag "N" -> "Y" pada parameter yang mau
;  dioptimasi (mis. InpStopLossPoints, InpBreakevenTrigger, dst).
; ==================================================================
